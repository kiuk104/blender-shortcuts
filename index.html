<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender 3.0 단축키 레퍼런스</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Blender Dark Theme */
            --bg-primary: #1D1D1D;
            --bg-secondary: #303030;
            --bg-tertiary: #424242;
            --bg-panel: #353535;
            --accent-orange: #ED5B17;
            --accent-blue: #5680C2;
            --accent-select: #ED9E28;
            --accent-purple: #9A5ACB;
            --accent-pink: #C75D8C;
            --accent-green: #5AA02C;
            --accent-yellow: #E5AC00;
            --accent-red: #C15050;
            --text-primary: #E0E0E0;
            --text-secondary: #909090;
            --text-dim: #686868;
            --border: #232323;
            --border-light: #4A4A4A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .background-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(78, 205, 196, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(78, 205, 196, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            position: relative;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .blender-logo {
            width: 80px;
            height: 80px;
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 30px 0;
            position: sticky;
            top: 10px;
            z-index: 100;
            background: rgba(10, 14, 26, 0.95);
            padding: 15px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Noto Sans KR', sans-serif;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.1);
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .filter-btn:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: var(--bg-primary);
        }

        .shortcuts-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .category-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            animation: slideUp 0.6s ease-out backwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }

        .category-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .category-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .shortcut-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            transition: all 0.2s ease;
            gap: 15px;
        }

        .shortcut-item:hover {
            transform: translateX(5px);
            background: rgba(78, 205, 196, 0.1);
        }

        .shortcut-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            flex: 1;
        }

        .shortcut-keys {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: flex-end;
        }

        .key {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            padding: 5px 10px;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--accent-blue);
            box-shadow: 0 2px 0 var(--border);
            white-space: nowrap;
        }

        .key-separator {
            color: var(--text-secondary);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
        }

        /* 카테고리별 색상 */
        .cat-general .category-icon { background: linear-gradient(135deg, #ff6b35, #ff8f6b); }
        .cat-navigation .category-icon { background: linear-gradient(135deg, #4ecdc4, #7eddd6); }
        .cat-view .category-icon { background: linear-gradient(135deg, #a855f7, #c084fc); }
        .cat-object .category-icon { background: linear-gradient(135deg, #22c55e, #4ade80); }
        .cat-selection .category-icon { background: linear-gradient(135deg, #eab308, #facc15); }
        .cat-shading .category-icon { background: linear-gradient(135deg, #ec4899, #f472b6); }
        .cat-pie .category-icon { background: linear-gradient(135deg, #06b6d4, #22d3ee); }
        .cat-editselect .category-icon { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }
        .cat-curve .category-icon { background: linear-gradient(135deg, #f97316, #fb923c); }
        .cat-modeling .category-icon { background: linear-gradient(135deg, #14b8a6, #2dd4bf); }
        .cat-texture .category-icon { background: linear-gradient(135deg, #d946ef, #e879f9); }
        .cat-uv .category-icon { background: linear-gradient(135deg, #0ea5e9, #38bdf8); }
        .cat-image .category-icon { background: linear-gradient(135deg, #84cc16, #a3e635); }
        .cat-nodes .category-icon { background: linear-gradient(135deg, #f43f5e, #fb7185); }
        .cat-sculpt .category-icon { background: linear-gradient(135deg, #6366f1, #818cf8); }
        .cat-render .category-icon { background: linear-gradient(135deg, #ef4444, #f87171); }
        .cat-animation .category-icon { background: linear-gradient(135deg, #10b981, #34d399); }
        .cat-rigging .category-icon { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
        .cat-posing .category-icon { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }
        .cat-window .category-icon { background: linear-gradient(135deg, #64748b, #94a3b8); }

        .no-results {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 60px;
            border-top: 1px solid var(--border);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .view-toggle {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        .view-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-blue));
            border: none;
            border-radius: 12px;
            color: #000;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .view-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 107, 53, 0.4);
        }

        .btn-icon {
            font-size: 1.3rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .shortcuts-container {
                grid-template-columns: 1fr;
            }
            
            .controls {
                position: relative;
                top: 0;
            }

            .filter-buttons {
                max-height: 150px;
                overflow-y: auto;
            }

            .shortcut-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .shortcut-keys {
                justify-content: flex-start;
            }
        }

        .hidden {
            display: none !important;
        }

        /* 스크롤바 스타일 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }
    </style>
</head>
<body>
    <div class="background-grid"></div>
    
    <div class="container">
        <header>

                    <div class="stat-label">카테고리</div>

            <div class="view-toggle">
                <a href="keyboard-layout.html" class="view-btn keyboard-btn">
                    <span class="btn-icon">⌨️</span>
                    <span>키보드 레이아웃으로 보기</span>
                </a>
            </div>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 단축키 또는 기능 검색..." autocomplete="off">
            </div>
            <div class="filter-buttons" id="filterButtons">
                <button class="filter-btn active" data-category="all">전체</button>

        <div class="shortcuts-container" id="shortcutsContainer">
        </div>

        <div class="no-results hidden" id="noResults">
            검색 결과가 없습니다 😢
        </div>

        <footer>
            <p>Based on Blender 3.0 Keyboard Shortcuts v1.2 by Blender Guru (2021)</p>
        </footer>
    </div>

        // 단축키 렌더링
        function renderShortcuts(data) {
            const container = document.getElementById('shortcutsContainer');
            container.innerHTML = '';

            data.forEach((category, index) => {
                const section = document.createElement('div');
                section.className = `category-section cat-${category.category}`;
                section.dataset.category = category.category;
                section.style.animationDelay = `${index * 0.05}s`;

                let shortcutsHTML = category.shortcuts.map(shortcut => {
                    const keysHTML = shortcut.keys.map(key => {
                        if (['또는', '→', '+', '/'].includes(key)) {
                            return `<span class="key-separator">${key}</span>`;
                        }
                        return `<span class="key">${key}</span>`;
                    }).join('');

                    return `
                        <div class="shortcut-item">
                            <span class="shortcut-description">${shortcut.desc}</span>
                            <div class="shortcut-keys">${keysHTML}</div>
                        </div>
                    `;
                }).join('');

                section.innerHTML = `
                    <div class="category-header">
                        <div class="category-icon">${category.icon}</div>
                        <h2 class="category-title">${category.title}</h2>
                    </div>
                    <div class="shortcut-list">
                        ${shortcutsHTML}
                    </div>
                `;

                container.appendChild(section);
            });

            // 통계 업데이트
            const totalShortcuts = data.reduce((sum, cat) => sum + cat.shortcuts.length, 0);
            document.getElementById('totalShortcuts').textContent = totalShortcuts;
            document.getElementById('totalCategories').textContent = data.length;
        }

        // 초기 렌더링
        renderShortcuts(shortcutsData);

        // 검색 및 필터
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');
        const shortcutsContainer = document.getElementById('shortcutsContainer');
        let currentCategory = 'all';

        searchInput.addEventListener('input', () => filterShortcuts());

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                filterShortcuts();
            });
        });

        function filterShortcuts() {
            const searchTerm = searchInput.value.toLowerCase();
            const sections = document.querySelectorAll('.category-section');
            let hasResults = false;

            sections.forEach(section => {
                const sectionCategory = section.dataset.category;
                const items = section.querySelectorAll('.shortcut-item');
                let sectionHasVisibleItems = false;

                if (currentCategory !== 'all' && sectionCategory !== currentCategory) {
                    section.classList.add('hidden');
                    return;
                }

                items.forEach(item => {
                    const description = item.querySelector('.shortcut-description').textContent.toLowerCase();
                    const keys = Array.from(item.querySelectorAll('.key'))
                        .map(k => k.textContent.toLowerCase())
                        .join(' ');

                    if (description.includes(searchTerm) || keys.includes(searchTerm)) {
                        item.style.display = 'flex';
                        sectionHasVisibleItems = true;
                        hasResults = true;
                    } else {
                        item.style.display = 'none';
                    }
                });

                if (sectionHasVisibleItems) {
                    section.classList.remove('hidden');
                } else {
                    section.classList.add('hidden');
                }
            });

            if (hasResults) {
                shortcutsContainer.classList.remove('hidden');
                noResults.classList.add('hidden');
            } else {
                shortcutsContainer.classList.add('hidden');
                noResults.classList.remove('hidden');
            }
        }
