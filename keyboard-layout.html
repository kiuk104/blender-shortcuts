<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender 3.0 키보드 레이아웃</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Blender Dark Theme */
            --bg-primary: #1D1D1D;
            --bg-secondary: #303030;
            --bg-key: #424242;
            --bg-key-hover: #4A4A4A;
            --accent-orange: #ED5B17;
            --accent-blue: #5680C2;
            --accent-purple: #9A5ACB;
            --accent-green: #5AA02C;
            --accent-yellow: #E5AC00;
            --accent-pink: #C75D8C;
            --accent-select: #ED9E28;
            --text-primary: #E0E0E0;
            --text-secondary: #909090;
            --border: #232323;
            --border-light: #4A4A4A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: auto;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .blender-logo {
            width: 60px;
            height: 60px;
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 800;
            color: #E0E0E0;
        }

        .version-badge {
            background: var(--accent-orange);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .legend-general { background: var(--accent-orange); }
        .legend-edit { background: var(--accent-blue); }
        .legend-view { background: var(--accent-purple); }
        .legend-transform { background: var(--accent-green); }
        .legend-selection { background: var(--accent-yellow); }
        .legend-modeling { background: var(--accent-pink); }

        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .mode-btn {
            padding: 10px 25px;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            background: var(--bg-key);
            color: var(--text-primary);
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            background: #505050;
        }

        .mode-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #FFFFFF;
        }

        .keyboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 25px 40px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin: 20px auto;
            max-width: 1600px;
            width: 95%;
            overflow-x: auto;
        }

        .keyboard-row {
            display: flex;
            gap: 4px;
        }

        .key {
            position: relative;
            min-width: 58px;
            height: 58px;
            background: var(--bg-key);
            border: 1px solid var(--border-light);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 4px;
        }

        .key:hover {
            background: #505050;
            border-color: var(--accent-blue);
            z-index: 10;
        }

        .key.has-shortcut {
            border-color: var(--accent-orange);
            background: #4A4030;
        }

        .key.has-shortcut:hover {
            border-color: var(--accent-select);
            background: #505040;
        }

        .key-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
        }

        .key-function {
            font-size: 0.55rem;
            color: var(--accent-orange);
            text-align: center;
            margin-top: 2px;
            line-height: 1.1;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .key-function.edit-mode {
            color: var(--accent-blue);
        }

        /* 특수 키 크기 */
        .key-esc { min-width: 58px; }
        .key-tab { min-width: 85px; }
        .key-caps { min-width: 95px; }
        .key-shift-l { min-width: 115px; }
        .key-shift-r { min-width: 140px; }
        .key-ctrl { min-width: 75px; }
        .key-alt { min-width: 58px; }
        .key-space { min-width: 320px; }
        .key-backspace { min-width: 105px; }
        .key-enter { min-width: 120px; }
        .key-fn { min-width: 48px; height: 42px; }

        /* 툴팁 */
        .tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: #3A3A3A;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            padding: 12px 15px;
            min-width: 250px;
            max-width: 350px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            pointer-events: none;
        }

        .key:hover .tooltip {
            opacity: 1;
            visibility: visible;
        }

        .tooltip-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .tooltip-content {
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .tooltip-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .tooltip-key {
            color: var(--accent-orange);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .tooltip-desc {
            color: var(--text-secondary);
            text-align: right;
        }

        .modifier-indicator {
            position: absolute;
            top: 3px;
            right: 3px;
            display: flex;
            gap: 2px;
        }

        .mod-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .mod-shift { background: var(--accent-yellow); }
        .mod-ctrl { background: var(--accent-green); }
        .mod-alt { background: var(--accent-purple); }

        .nav-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: var(--accent-orange);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            background: #FF7030;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* 반응형 */
        @media (max-width: 1300px) {
            .keyboard-container {
                transform: scale(0.9);
                transform-origin: top center;
            }
        }

        @media (max-width: 1100px) {
            .keyboard-container {
                transform: scale(0.75);
            }
        }

        @media (max-width: 900px) {
            .keyboard-container {
                transform: scale(0.6);
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.5rem; }
            .keyboard-container {
                transform: scale(0.5);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-row">
                <svg class="blender-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="blenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff6b35"/>
                            <stop offset="100%" style="stop-color:#f5792a"/>
                        </linearGradient>
                    </defs>
                    <ellipse cx="50" cy="55" rx="35" ry="25" fill="url(#blenderGrad)"/>
                    <ellipse cx="50" cy="55" rx="12" ry="9" fill="#1a1a2e"/>
                    <ellipse cx="50" cy="55" rx="5" ry="4" fill="#06b6d4"/>
                    <path d="M15 50 Q5 50 15 55 L35 55 Q25 52 35 50 Z" fill="url(#blenderGrad)"/>
                    <circle cx="28" cy="45" r="6" fill="url(#blenderGrad)"/>
                </svg>
                <h1>BLENDER KEYBOARD LAYOUT</h1>
                <span class="version-badge">3.0</span>
            </div>
            <p style="color: var(--text-secondary);">키 위에 마우스를 올려 단축키 정보를 확인하세요</p>

            <div class="legend">
                <div class="legend-item"><div class="legend-color legend-general"></div><span>일반/변형</span></div>
                <div class="legend-item"><div class="legend-color legend-edit"></div><span>편집 모드</span></div>
                <div class="legend-item"><div class="legend-color legend-view"></div><span>뷰/네비게이션</span></div>
                <div class="legend-item"><div class="legend-color legend-transform"></div><span>트랜스폼</span></div>
                <div class="legend-item"><div class="legend-color legend-selection"></div><span>선택</span></div>
                <div class="legend-item"><div class="legend-color legend-modeling"></div><span>모델링</span></div>
            </div>

            <div class="mode-toggle">
                <button class="mode-btn active" data-mode="object">오브젝트 모드</button>
                <button class="mode-btn" data-mode="edit">편집 모드</button>
                <button class="mode-btn" data-mode="sculpt">스컬핑</button>
            </div>
        </header>

        <div class="keyboard-container" id="keyboard">
            <!-- 키보드 레이아웃이 JavaScript로 생성됩니다 -->
        </div>

        <div style="text-align: center;">
            <a href="https://kiuk104.github.io/blender-shortcuts/" class="nav-link">📋 리스트 형식으로 보기</a>
        </div>

        <footer>
            <p>Blender 3.0 Keyboard Shortcuts Layout | Based on Blender Guru Reference</p>
        </footer>
    </div>

    <script>
        // 키보드 레이아웃 데이터
        const keyboardLayout = [
            // Function Row
            [
                { key: 'Esc', width: 'esc' },
                { key: 'F1', width: 'fn' },
                { key: 'F2', width: 'fn' },
                { key: 'F3', width: 'fn', shortcuts: { default: '기능 검색' } },
                { key: 'F4', width: 'fn' },
                { key: 'F5', width: 'fn' },
                { key: 'F6', width: 'fn' },
                { key: 'F7', width: 'fn' },
                { key: 'F8', width: 'fn' },
                { key: 'F9', width: 'fn' },
                { key: 'F10', width: 'fn' },
                { key: 'F11', width: 'fn', shortcuts: { ctrl: '렌더 애니 재생' } },
                { key: 'F12', width: 'fn', shortcuts: { default: '렌더', ctrl: '애니메이션 렌더' } }
            ],
            // Number Row
            [
                { key: '`', label: '~', shortcuts: { default: '뷰 파이메뉴', shift: '플라이 모드' } },
                { key: '1', shortcuts: { default: '버텍스 모드', alt: '렌더슬롯 1' } },
                { key: '2', shortcuts: { default: '엣지 모드', alt: '렌더슬롯 2' } },
                { key: '3', shortcuts: { default: '페이스 모드', alt: '렌더슬롯 3' } },
                { key: '4', shortcuts: { alt: '렌더슬롯 4' } },
                { key: '5', shortcuts: { alt: '렌더슬롯 5' } },
                { key: '6', shortcuts: { alt: '렌더슬롯 6' } },
                { key: '7', shortcuts: { alt: '렌더슬롯 7' } },
                { key: '8', shortcuts: { alt: '렌더슬롯 8' } },
                { key: '9' },
                { key: '0' },
                { key: '-', shortcuts: { ctrl: '선택 축소' } },
                { key: '=', label: '+', shortcuts: { ctrl: '선택 확장' } },
                { key: 'Back', label: '⌫', width: 'backspace' }
            ],
            // QWERTY Row
            [
                { key: 'Tab', width: 'tab', shortcuts: { default: '편집/오브젝트 토글', ctrl: '모드 파이메뉴', shift: '스냅 토글' } },
                { key: 'Q', shortcuts: { default: '즐겨찾기 메뉴', ctrl: '쿼드뷰' } },
                { key: 'W', shortcuts: { shift: '굽히기 (Bend)' } },
                { key: 'E', shortcuts: { default: '돌출 (Extrude)', shift: '키프레임 외삽' } },
                { key: 'R', shortcuts: { default: '회전', ctrl: '루프컷' } },
                { key: 'T', shortcuts: { default: '툴바', ctrl: '프레임/초 토글' } },
                { key: 'Y', shortcuts: { default: '분할 (Split)' } },
                { key: 'U', shortcuts: { default: '언랩' } },
                { key: 'I', shortcuts: { default: '면 삽입/키프레임', ctrl: '선택 반전', alt: '키프레임 삭제' } },
                { key: 'O', shortcuts: { default: '비례편집 On/Off', shift: '비례편집 감쇠' } },
                { key: 'P', shortcuts: { default: '새 오브젝트로 분리', ctrl: '부모 설정', alt: '부모 해제' } },
                { key: '[', shortcuts: { default: '이전 키프레임 선택' } },
                { key: ']', shortcuts: { default: '다음 키프레임 선택' } },
                { key: '\\', label: '\\' }
            ],
            // ASDF Row
            [
                { key: 'Caps', label: 'Caps', width: 'caps' },
                { key: 'A', shortcuts: { default: '전체 선택', alt: '전체 해제', shift: '오브젝트 추가', ctrl: '적용' } },
                { key: 'S', shortcuts: { default: '크기 조절', shift: '스냅 파이메뉴', alt: '이미지 저장' } },
                { key: 'D', shortcuts: { default: '주석 (유지+드래그)', shift: '복제', alt: '링크 복제' } },
                { key: 'F', shortcuts: { default: '면 채우기/브러시 크기' } },
                { key: 'G', shortcuts: { default: '이동', shift: '유사한 것 선택' } },
                { key: 'H', shortcuts: { default: '숨기기', alt: '전체 표시', shift: '선택 외 숨기기', ctrl: '노드슬롯 토글' } },
                { key: 'J', shortcuts: { default: '다음 렌더슬롯', alt: '이전 렌더슬롯', ctrl: '오브젝트 합치기' } },
                { key: 'K', shortcuts: { default: '나이프', ctrl: '키프레임 선택' } },
                { key: 'L', shortcuts: { default: '연결 메시 선택', shift: '연결된 것 선택', ctrl: '속성 복사' } },
                { key: ';' },
                { key: "'", label: "'" },
                { key: 'Enter', width: 'enter' }
            ],
            // ZXCV Row
            [
                { key: 'LShift', label: 'Shift', width: 'shift-l' },
                { key: 'Z', shortcuts: { default: '셰이딩 파이메뉴', alt: 'X-Ray 토글', ctrl: '실행취소' } },
                { key: 'X', shortcuts: { default: '삭제', ctrl: '연결유지 삭제' } },
                { key: 'C', shortcuts: { default: '서클 선택', shift: '3D커서 중앙', alt: '커브 닫기', ctrl: '포즈 복사' } },
                { key: 'V', shortcuts: { default: '찢기 (Rip)/핸들타입', alt: '채우며 찢기', ctrl: '포즈 붙여넣기' } },
                { key: 'B', shortcuts: { default: '박스 선택', shift: '영역 확대', ctrl: '베벨/렌더 영역', alt: '영역 마스크' } },
                { key: 'N', shortcuts: { default: '속성 패널', shift: '노멀 재계산' } },
                { key: 'M', shortcuts: { default: '컬렉션 이동/병합', ctrl: '마커/키프레임 미러' } },
                { key: ',', shortcuts: { default: '오리엔테이션 파이' } },
                { key: '.', shortcuts: { default: '피벗 포인트 파이' } },
                { key: '/', shortcuts: { default: '격리 보기 (Numpad)' } },
                { key: 'RShift', label: 'Shift', width: 'shift-r' }
            ],
            // Bottom Row
            [
                { key: 'LCtrl', label: 'Ctrl', width: 'ctrl' },
                { key: 'Win', label: '⊞' },
                { key: 'LAlt', label: 'Alt', width: 'alt' },
                { key: 'Space', label: 'Space', width: 'space', shortcuts: { default: '재생/정지', shift: '브러시 선택', ctrl: '영역 최대화' } },
                { key: 'RAlt', label: 'Alt', width: 'alt' },
                { key: 'Fn', label: 'Fn' },
                { key: 'Menu', label: '☰' },
                { key: 'RCtrl', label: 'Ctrl', width: 'ctrl' }
            ]
        ];

        // Numpad 레이아웃
        const numpadLayout = [
            [
                { key: 'Num/', shortcuts: { default: '격리 보기' } },
                { key: 'Num*' },
                { key: 'Num-' }
            ],
            [
                { key: 'Num7', shortcuts: { default: '탑 뷰' } },
                { key: 'Num8', shortcuts: { default: '위로 회전' } },
                { key: 'Num9', shortcuts: { default: '반대편 뷰' } }
            ],
            [
                { key: 'Num4', shortcuts: { default: '왼쪽 회전' } },
                { key: 'Num5', shortcuts: { default: '원근/직교 토글' } },
                { key: 'Num6', shortcuts: { default: '오른쪽 회전' } }
            ],
            [
                { key: 'Num1', shortcuts: { default: '프론트 뷰', ctrl: '카메라로 설정' } },
                { key: 'Num2', shortcuts: { default: '아래로 회전' } },
                { key: 'Num3', shortcuts: { default: '사이드 뷰' } }
            ],
            [
                { key: 'Num0', shortcuts: { default: '카메라 뷰', ctrl: '활성 카메라 설정', ctrlAlt: '카메라를 뷰로' } },
                { key: 'Num.', shortcuts: { default: '선택에 포커스' } },
                { key: 'NumEnter' }
            ]
        ];

        // 키보드 생성
        function createKeyboard() {
            const container = document.getElementById('keyboard');
            container.innerHTML = '';

            const mainKeyboard = document.createElement('div');
            mainKeyboard.style.display = 'flex';
            mainKeyboard.style.gap = '30px';

            // 메인 키보드
            const mainSection = document.createElement('div');
            mainSection.style.display = 'flex';
            mainSection.style.flexDirection = 'column';
            mainSection.style.gap = '6px';

            keyboardLayout.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';

                row.forEach(keyData => {
                    const keyDiv = createKey(keyData);
                    rowDiv.appendChild(keyDiv);
                });

                mainSection.appendChild(rowDiv);
            });

            // Numpad
            const numpadSection = document.createElement('div');
            numpadSection.style.display = 'flex';
            numpadSection.style.flexDirection = 'column';
            numpadSection.style.gap = '6px';
            numpadSection.style.marginLeft = '20px';

            const numpadTitle = document.createElement('div');
            numpadTitle.style.textAlign = 'center';
            numpadTitle.style.color = 'var(--text-secondary)';
            numpadTitle.style.fontSize = '0.8rem';
            numpadTitle.style.marginBottom = '5px';
            numpadTitle.textContent = 'Numpad';
            numpadSection.appendChild(numpadTitle);

            numpadLayout.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';

                row.forEach(keyData => {
                    const keyDiv = createKey(keyData);
                    rowDiv.appendChild(keyDiv);
                });

                numpadSection.appendChild(rowDiv);
            });

            mainKeyboard.appendChild(mainSection);
            mainKeyboard.appendChild(numpadSection);
            container.appendChild(mainKeyboard);
        }

        function createKey(keyData) {
            const keyDiv = document.createElement('div');
            keyDiv.className = 'key';
            
            if (keyData.width) {
                keyDiv.classList.add(`key-${keyData.width}`);
            }

            if (keyData.shortcuts) {
                keyDiv.classList.add('has-shortcut');
            }

            // 키 레이블
            const labelDiv = document.createElement('div');
            labelDiv.className = 'key-label';
            labelDiv.textContent = keyData.label || keyData.key;
            keyDiv.appendChild(labelDiv);

            // 기본 기능 표시
            if (keyData.shortcuts && keyData.shortcuts.default) {
                const funcDiv = document.createElement('div');
                funcDiv.className = 'key-function';
                funcDiv.textContent = keyData.shortcuts.default;
                keyDiv.appendChild(funcDiv);
            }

            // 모디파이어 인디케이터
            if (keyData.shortcuts) {
                const modDiv = document.createElement('div');
                modDiv.className = 'modifier-indicator';
                
                if (keyData.shortcuts.shift) {
                    const dot = document.createElement('div');
                    dot.className = 'mod-dot mod-shift';
                    modDiv.appendChild(dot);
                }
                if (keyData.shortcuts.ctrl) {
                    const dot = document.createElement('div');
                    dot.className = 'mod-dot mod-ctrl';
                    modDiv.appendChild(dot);
                }
                if (keyData.shortcuts.alt) {
                    const dot = document.createElement('div');
                    dot.className = 'mod-dot mod-alt';
                    modDiv.appendChild(dot);
                }
                
                if (modDiv.children.length > 0) {
                    keyDiv.appendChild(modDiv);
                }
            }

            // 툴팁
            if (keyData.shortcuts) {
                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip';

                const title = document.createElement('div');
                title.className = 'tooltip-title';
                title.textContent = `${keyData.label || keyData.key} 키`;
                tooltip.appendChild(title);

                const content = document.createElement('div');
                content.className = 'tooltip-content';

                if (keyData.shortcuts.default) {
                    content.innerHTML += `<div class="tooltip-item"><span class="tooltip-key">${keyData.label || keyData.key}</span><span class="tooltip-desc">${keyData.shortcuts.default}</span></div>`;
                }
                if (keyData.shortcuts.shift) {
                    content.innerHTML += `<div class="tooltip-item"><span class="tooltip-key">Shift + ${keyData.label || keyData.key}</span><span class="tooltip-desc">${keyData.shortcuts.shift}</span></div>`;
                }
                if (keyData.shortcuts.ctrl) {
                    content.innerHTML += `<div class="tooltip-item"><span class="tooltip-key">Ctrl + ${keyData.label || keyData.key}</span><span class="tooltip-desc">${keyData.shortcuts.ctrl}</span></div>`;
                }
                if (keyData.shortcuts.alt) {
                    content.innerHTML += `<div class="tooltip-item"><span class="tooltip-key">Alt + ${keyData.label || keyData.key}</span><span class="tooltip-desc">${keyData.shortcuts.alt}</span></div>`;
                }
                if (keyData.shortcuts.ctrlAlt) {
                    content.innerHTML += `<div class="tooltip-item"><span class="tooltip-key">Ctrl+Alt + ${keyData.label || keyData.key}</span><span class="tooltip-desc">${keyData.shortcuts.ctrlAlt}</span></div>`;
                }

                tooltip.appendChild(content);
                keyDiv.appendChild(tooltip);
            }

            return keyDiv;
        }

        // 모드 토글
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                // 여기서 모드에 따라 표시되는 단축키를 변경할 수 있습니다
            });
        });

        // 초기화
        createKeyboard();
    </script>
</body>
</html>
