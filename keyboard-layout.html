<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender 3.0 키보드 레이아웃</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Blender Dark Theme */
            --bg-primary: #1D1D1D;
            --bg-secondary: #303030;
            --bg-key: #424242;
            --bg-key-hover: #4A4A4A;
            --accent-orange: #ED5B17;
            --accent-blue: #5680C2;
            --accent-purple: #9A5ACB;
            --accent-green: #5AA02C;
            --accent-yellow: #E5AC00;
            --accent-pink: #C75D8C;
            --accent-select: #ED9E28;
            --text-primary: #E0E0E0;
            --text-secondary: #909090;
            --border: #232323;
            --border-light: #4A4A4A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: auto;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .blender-logo {
            width: 60px;
            height: 60px;
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 800;
            color: #E0E0E0;
        }

        .version-badge {
            background: var(--accent-orange);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .legend-general { background: var(--accent-orange); }
        .legend-edit { background: var(--accent-blue); }
        .legend-view { background: var(--accent-purple); }
        .legend-transform { background: var(--accent-green); }
        .legend-selection { background: var(--accent-yellow); }
        .legend-modeling { background: var(--accent-pink); }

        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .mode-btn {
            padding: 10px 25px;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            background: var(--bg-key);
            color: var(--text-primary);
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            background: #505050;
        }

        .mode-btn.active {
            color: #FFFFFF;
        }

        .mode-btn[data-mode="object"].active {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
        }

        .mode-btn[data-mode="edit"].active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .mode-btn[data-mode="sculpt"].active {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
        }

        .keyboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 25px 40px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin: 20px auto;
            max-width: 1600px;
            width: 95%;
            overflow-x: auto;
        }

        .keyboard-row {
            display: flex;
            gap: 4px;
        }

        .key {
            position: relative;
            min-width: 58px;
            height: 58px;
            background: var(--bg-key);
            border: 1px solid var(--border-light);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 4px;
        }

        .key:hover {
            background: #505050;
            border-color: var(--accent-blue);
            z-index: 10;
        }

        .key.has-shortcut {
            border-color: var(--accent-orange);
            background: #4A4030;
        }

        .key.has-shortcut:hover {
            border-color: var(--accent-select);
            background: #505040;
        }

        /* 모드별 키 색상 */
        .key.mode-object.has-shortcut {
            border-color: var(--accent-orange);
            background: #4A3D30;
        }
        .key.mode-object.has-shortcut:hover {
            border-color: #FF7030;
            background: #5A4D40;
        }

        .key.mode-edit.has-shortcut {
            border-color: var(--accent-blue);
            background: #303D4A;
        }
        .key.mode-edit.has-shortcut:hover {
            border-color: #70A0E0;
            background: #404D5A;
        }

        .key.mode-sculpt.has-shortcut {
            border-color: var(--accent-purple);
            background: #403050;
        }
        .key.mode-sculpt.has-shortcut:hover {
            border-color: #B080E0;
            background: #504060;
        }

        .key.mode-edit .key-function {
            color: var(--accent-blue);
        }

        .key.mode-sculpt .key-function {
            color: var(--accent-purple);
        }

        .key-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
        }

        .key-function {
            font-size: 0.55rem;
            color: var(--accent-orange);
            text-align: center;
            margin-top: 2px;
            line-height: 1.1;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .key-function.edit-mode {
            color: var(--accent-blue);
        }

        /* 특수 키 크기 */
        .key-esc { min-width: 58px; }
        .key-tab { min-width: 85px; }
        .key-caps { min-width: 95px; }
        .key-shift-l { min-width: 115px; }
        .key-shift-r { min-width: 140px; }
        .key-ctrl { min-width: 75px; }
        .key-alt { min-width: 58px; }
        .key-space { min-width: 320px; }
        .key-backspace { min-width: 105px; }
        .key-enter { min-width: 120px; }
        .key-fn { min-width: 48px; height: 42px; }

        /* 툴팁 */
        .tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: #3A3A3A;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            padding: 12px 15px;
            min-width: 250px;
            max-width: 350px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            pointer-events: none;
        }

        .key:hover .tooltip {
            opacity: 1;
            visibility: visible;
        }

        .tooltip-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .tooltip-content {
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .tooltip-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .tooltip-key {
            color: var(--accent-orange);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .tooltip-desc {
            color: var(--text-secondary);
            text-align: right;
        }

        .modifier-indicator {
            position: absolute;
            top: 3px;
            right: 3px;
            display: flex;
            gap: 2px;
        }

        .mod-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .mod-shift { background: var(--accent-yellow); }
        .mod-ctrl { background: var(--accent-green); }
        .mod-alt { background: var(--accent-purple); }

        .nav-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: var(--accent-orange);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            background: #FF7030;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* 반응형 */
        @media (max-width: 1300px) {
            .keyboard-container {
                transform: scale(0.9);
                transform-origin: top center;
            }
        }

        @media (max-width: 1100px) {
            .keyboard-container {
                transform: scale(0.75);
            }
        }

        @media (max-width: 900px) {
            .keyboard-container {
                transform: scale(0.6);
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.5rem; }
            .keyboard-container {
                transform: scale(0.5);
            }
        }
    </style>
</head>

        </div>

        <footer>
            <p>Blender 3.0 Keyboard Shortcuts Layout | Based on Blender Guru Reference</p>
        </footer>
    </div>

                'I': { default: '인플레이트 브러시' },
                'O': {},
                'P': { default: '핀치 브러시' },
                '[': { default: '브러시 크기 줄이기' },
                ']': { default: '브러시 크기 키우기' },
                'A': { default: '마스크 전체', alt: '마스크 해제', ctrl: '마스크 반전' },
                'S': { default: '스무스 브러시' },
                'D': { default: '드로우 브러시' },
                'F': { default: '브러시 크기 조절' },
                'G': { default: '그랩 브러시' },
                'H': { default: '마스크 숨기기', alt: '전체 표시', shift: '마스크 외 숨기기' },
                'J': {},
                'K': {},
                'L': { default: '레이어 브러시' },
                'Z': { default: '셰이딩 파이', alt: 'X-Ray 토글', ctrl: '실행취소' },
                'X': { default: '드로우 X 미러', shift: '스트로크 드로우 방향' },
                'C': { default: '클레이 브러시', shift: '클레이 스트립' },
                'V': { default: '마스크 브러시' },
                'B': { default: '블롭 브러시', ctrl: '박스 마스크' },
                'N': { default: '속성 패널', shift: '노멀 재계산' },
                'M': { default: '멀티레즈 레벨', ctrl: '마스크 메뉴' },
                ',': {},
                '.': {},
                '/': {},
                'Space': { default: '브러시 선택', shift: '브러시 선택', ctrl: '영역 최대화' },
                'Num/': { default: '격리 보기' },
                'Num7': { default: '탑 뷰' },
                'Num1': { default: '프론트 뷰' },
                'Num3': { default: '사이드 뷰' },
                'Num5': { default: '원근/직교 토글' },
                'Num0': { default: '카메라 뷰' },
                'Num.': { default: '선택에 포커스' },
                'Num8': { default: '위로 회전' },
                'Num2': { default: '아래로 회전' },
                'Num4': { default: '왼쪽 회전' },
                'Num6': { default: '오른쪽 회전' },
                'Num9': { default: '반대편 뷰' }
            }
        };

        // 기본 키보드 레이아웃 (구조만)
        const keyboardStructure = [
            // Function Row
            [
                { key: 'Esc', width: 'esc' },
                { key: 'F1', width: 'fn' },
                { key: 'F2', width: 'fn' },
                { key: 'F3', width: 'fn' },
                { key: 'F4', width: 'fn' },
                { key: 'F5', width: 'fn' },
                { key: 'F6', width: 'fn' },
                { key: 'F7', width: 'fn' },
                { key: 'F8', width: 'fn' },
                { key: 'F9', width: 'fn' },
                { key: 'F10', width: 'fn' },
                { key: 'F11', width: 'fn' },
                { key: 'F12', width: 'fn' }
            ],
            // Number Row
            [
                { key: '`', label: '~' },
                { key: '1' },
                { key: '2' },
                { key: '3' },
                { key: '4' },
                { key: '5' },
                { key: '6' },
                { key: '7' },
                { key: '8' },
                { key: '9' },
                { key: '0' },
                { key: '-' },
                { key: '=', label: '+' },
                { key: 'Back', label: '⌫', width: 'backspace' }
            ],
            // QWERTY Row
            [
                { key: 'Tab', width: 'tab' },
                { key: 'Q' },
                { key: 'W' },
                { key: 'E' },
                { key: 'R' },
                { key: 'T' },
                { key: 'Y' },
                { key: 'U' },
                { key: 'I' },
                { key: 'O' },
                { key: 'P' },
                { key: '[' },
                { key: ']' },
                { key: '\\', label: '\\' }
            ],
            // ASDF Row
            [
                { key: 'Caps', label: 'Caps', width: 'caps' },
                { key: 'A' },
                { key: 'S' },
                { key: 'D' },
                { key: 'F' },
                { key: 'G' },
                { key: 'H' },
                { key: 'J' },
                { key: 'K' },
                { key: 'L' },
                { key: ';' },
                { key: "'", label: "'" },
                { key: 'Enter', width: 'enter' }
            ],
            // ZXCV Row
            [
                { key: 'LShift', label: 'Shift', width: 'shift-l' },
                { key: 'Z' },
                { key: 'X' },
                { key: 'C' },
                { key: 'V' },
                { key: 'B' },
                { key: 'N' },
                { key: 'M' },
                { key: ',' },
                { key: '.' },
                { key: '/' },
                { key: 'RShift', label: 'Shift', width: 'shift-r' }
            ],
            // Bottom Row
            [
                { key: 'LCtrl', label: 'Ctrl', width: 'ctrl' },
                { key: 'Win', label: '⊞' },
                { key: 'LAlt', label: 'Alt', width: 'alt' },
                { key: 'Space', label: 'Space', width: 'space' },
                { key: 'RAlt', label: 'Alt', width: 'alt' },
                { key: 'Fn', label: 'Fn' },
                { key: 'Menu', label: '☰' },
                { key: 'RCtrl', label: 'Ctrl', width: 'ctrl' }
            ]
        ];

        // Numpad 구조
        const numpadStructure = [
            [
                { key: 'Num/' },
                { key: 'Num*' },
                { key: 'Num-' }
            ],
            [
                { key: 'Num7' },
                { key: 'Num8' },
                { key: 'Num9' }
            ],
            [
                { key: 'Num4' },
                { key: 'Num5' },
                { key: 'Num6' }
            ],
            [
                { key: 'Num1' },
                { key: 'Num2' },
                { key: 'Num3' }
            ],
            [
                { key: 'Num0' },
                { key: 'Num.' },
                { key: 'NumEnter' }
            ]
        ];

        // 모드에 따른 색상 클래스
        const modeColors = {
            object: 'mode-object',
            edit: 'mode-edit',
            sculpt: 'mode-sculpt'
        };

        // 현재 모드의 단축키 가져오기
        function getShortcutsForKey(key) {
            const shortcuts = modeShortcuts[currentMode];
            return shortcuts[key] || null;
        }

        // 키보드 생성
        function createKeyboard() {
            const container = document.getElementById('keyboard');
            container.innerHTML = '';

            const mainKeyboard = document.createElement('div');
            mainKeyboard.style.display = 'flex';
            mainKeyboard.style.gap = '20px';

            // 메인 키보드
            const mainSection = document.createElement('div');
            mainSection.style.display = 'flex';
            mainSection.style.flexDirection = 'column';
            mainSection.style.gap = '4px';

            keyboardStructure.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';

                row.forEach(keyData => {
                    const keyDiv = createKey(keyData);
                    rowDiv.appendChild(keyDiv);
                });

                mainSection.appendChild(rowDiv);
            });

            // Numpad
            const numpadSection = document.createElement('div');
            numpadSection.style.display = 'flex';
            numpadSection.style.flexDirection = 'column';
            numpadSection.style.gap = '4px';
            numpadSection.style.marginLeft = '15px';

            const numpadTitle = document.createElement('div');
            numpadTitle.style.textAlign = 'center';
            numpadTitle.style.color = 'var(--text-secondary)';
            numpadTitle.style.fontSize = '0.7rem';
            numpadTitle.style.marginBottom = '4px';
            numpadTitle.textContent = 'Numpad';
            numpadSection.appendChild(numpadTitle);

            numpadStructure.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';

                row.forEach(keyData => {
                    const keyDiv = createKey(keyData);
                    rowDiv.appendChild(keyDiv);
                });

                numpadSection.appendChild(rowDiv);
            });

            mainKeyboard.appendChild(mainSection);
            mainKeyboard.appendChild(numpadSection);
            container.appendChild(mainKeyboard);
        }

        function createKey(keyData) {
            const keyDiv = document.createElement('div');
            keyDiv.className = 'key';
            
            if (keyData.width) {
                keyDiv.classList.add(`key-${keyData.width}`);
            }

            // 현재 모드의 단축키 가져오기
            const shortcuts = getShortcutsForKey(keyData.key);

            if (shortcuts && Object.keys(shortcuts).length > 0) {
                keyDiv.classList.add('has-shortcut');
                keyDiv.classList.add(modeColors[currentMode]);
            }

            // 키 레이블
            const labelDiv = document.createElement('div');
            labelDiv.className = 'key-label';
            labelDiv.textContent = keyData.label || keyData.key;
            keyDiv.appendChild(labelDiv);

            // 기본 기능 표시
            if (shortcuts && shortcuts.default) {
                const funcDiv = document.createElement('div');
                funcDiv.className = 'key-function';
                funcDiv.textContent = shortcuts.default;
                keyDiv.appendChild(funcDiv);
            }

            // 모디파이어 인디케이터
            if (shortcuts) {
                const modDiv = document.createElement('div');
                modDiv.className = 'modifier-indicator';
                
                if (shortcuts.shift) {
                    const dot = document.createElement('div');
                    dot.className = 'mod-dot mod-shift';
                    modDiv.appendChild(dot);
                }
                if (shortcuts.ctrl) {
                    const dot = document.createElement('div');
                    dot.className = 'mod-dot mod-ctrl';
                    modDiv.appendChild(dot);
                }
                if (shortcuts.alt) {
                    const dot = document.createElement('div');
                    dot.className = 'mod-dot mod-alt';
                    modDiv.appendChild(dot);
                }
                
                if (modDiv.children.length > 0) {
                    keyDiv.appendChild(modDiv);
                }
            }

            // 툴팁
            if (shortcuts && Object.keys(shortcuts).length > 0) {
                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip';

                const title = document.createElement('div');
                title.className = 'tooltip-title';
                title.textContent = `${keyData.label || keyData.key} 키`;
                tooltip.appendChild(title);

                const content = document.createElement('div');
                content.className = 'tooltip-content';

                if (shortcuts.default) {
                    content.innerHTML += `<div class="tooltip-item"><span class="tooltip-key">${keyData.label || keyData.key}</span><span class="tooltip-desc">${shortcuts.default}</span></div>`;
                }
                if (shortcuts.shift) {
                    content.innerHTML += `<div class="tooltip-item"><span class="tooltip-key">Shift + ${keyData.label || keyData.key}</span><span class="tooltip-desc">${shortcuts.shift}</span></div>`;
                }
                if (shortcuts.ctrl) {
                    content.innerHTML += `<div class="tooltip-item"><span class="tooltip-key">Ctrl + ${keyData.label || keyData.key}</span><span class="tooltip-desc">${shortcuts.ctrl}</span></div>`;
                }
                if (shortcuts.alt) {
                    content.innerHTML += `<div class="tooltip-item"><span class="tooltip-key">Alt + ${keyData.label || keyData.key}</span><span class="tooltip-desc">${shortcuts.alt}</span></div>`;
                }

                tooltip.appendChild(content);
                keyDiv.appendChild(tooltip);
            }

            return keyDiv;
        }

        // 모드 전환
        function switchMode(mode) {
            currentMode = mode;
            
            // 버튼 활성화 상태 변경
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.mode === mode) {
                    btn.classList.add('active');
                }
            });

            // 키보드 재생성
            createKeyboard();
        }

        // 모드 버튼 이벤트
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchMode(btn.dataset.mode);
            });
        });

        // 초기화
        createKeyboard();
    </script>
</body>
</html>
